{#foreach $T as List}
<ul class="mli7">
    <li class="contentblock">
        <span class="mst">
            <input type="checkbox" id='{$T.index}' value='{ $T.List.KeyValue }' />
        </span>
        <a class="mct" href="#" onclick="javascript:List.ViewList('{ $T.List.Gubun }','{ $T.List.OwnerID }','{ $T.List.Mail }')">
            <font style="font-weight:bold;">{ $T.List.Name }</font> <span class="lis">{ $T.List.DeptName }  { $T.List.TitleName }</span>
        </a>
    </li>
</ul>
{#else}   
<li class="contentblock">
    <div class="title">
        <a href="#" class="mct"><span id="NoListData" class="lif" />&nbsp;</a>
    </div>
</li>
{#/for}
