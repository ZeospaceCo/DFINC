	<table class="month cb2" width="100%">
	<colgroup span="7" width="14%"></colgroup>
	<thead>
	<tr>
	<th scope="col" class="hol" id="JSunE"></th>
	<th scope="col" id="JMonE"></th>
	<th scope="col" id="JTueE"></th>
	<th scope="col" id="JWedE"></th>
	<th scope="col" id="JThuE"></th>
	<th scope="col" id="JFriE"></th>
	<th scope="col" id="JSatE"></th>
	</tr>
	</thead>
    <tbody>
        {#foreach $T as Cal}
        {#if $T.Cal.Week == '0'}
        <tr>
        {#/if}
        <td class="{ $T.Cal.Class }" id="E_{ $T.Cal.Index }"><a onclick="CalendarDual.End{ $T.Cal.Func }">{ $T.Cal.Day }</a></td>
        {#if $T.Cal.Week == '6'}
        </tr>
        {#/if}
        {#/for}     
    </tbody>
	</table>
