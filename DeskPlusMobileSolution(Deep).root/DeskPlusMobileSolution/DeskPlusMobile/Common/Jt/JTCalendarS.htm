	<table class="month cb2" width="100%">
	<colgroup span="7" width="14%"></colgroup>
	<thead>
	<tr>
	<th scope="col" class="hol" id="JSunS"></th>
	<th scope="col" id="JMonS"></th>
	<th scope="col" id="JTueS"></th>
	<th scope="col" id="JWedS"></th>
	<th scope="col" id="JThuS"></th>
	<th scope="col" id="JFriS"></th>
	<th scope="col" id="JSatS"></th>
	</tr>
	</thead>
    <tbody>
        {#foreach $T as Cal}
        {#if $T.Cal.Week == '0'}
        <tr>
        {#/if}
        <td class="{ $T.Cal.Class }" id="S_{ $T.Cal.Index }"><a onclick="CalendarDual.Start{ $T.Cal.Func }">{ $T.Cal.Day }</a></td>
        {#if $T.Cal.Week == '6'}
        </tr>
        {#/if}
        {#/for}     
    </tbody>
	</table>
