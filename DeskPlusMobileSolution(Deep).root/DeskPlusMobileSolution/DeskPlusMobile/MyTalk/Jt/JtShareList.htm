{#foreach $T as List}
    <ul class="ali">
    <li> 
        {#if $T.List.View == 'Y'} 
        <a class="mct" onclick="javascript:List.ViewList('{ $T.List.GroupID }')">
        <table class="blog_table">
        <colgroup><col width="65px" /><col /></colgroup>                                                
        <tbody>
        <tr>
            <td class="blog_img" rowspan="2"> {$T.List.Depth}{$T.List.PhotoImage}</td>
            <td class="blog_cont">{$T.List.RUserName} {$T.List.Content} {$T.List.ShowNew}</td>
        </tr>
        <tr>
            <td><span class="blog_subDate">{ $T.List.UserName } {$T.List.WriteDateYMD }</span></td>
        </tr>
        </tbody>
        </table>
        </a>
        {#else}
        <a class="mct">{$T.List.Depth}{$T.List.Content}<br />   
        &nbsp;</a> 
        {#/if}
    </li>
    </ul>
{#else}   
<ul class="ali"> 
<li><a href="#" class="mct"><span id="NoListData" class="lif" /><br />   
    &nbsp;</a></li>    
</ul>
{#/for}
