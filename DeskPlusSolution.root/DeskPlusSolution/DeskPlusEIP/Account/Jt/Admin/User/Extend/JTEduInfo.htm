<table cellspacing="0" class="table_typeA"> 
<colgroup>
    <col width="*" />
    <col width="100px" />
    <col width="100px" />
    <col width="150px" />
    <col width="100px" />
    <col width="180px" />
    <col width="60px" />
</colgroup>
    <tr>        
        <th class="center" id="r_name"></th>
        <th class="center" id="r_point"></th>
        <th class="center" id="r_grade"></th>
        <th class="center" id="r_place"></th>                                    
        <th class="center" id="r_date"></th>
        <th class="center" id="r_isfinish"></th>
        <th class="center" id="r_del"></th>
    </tr>
    {#foreach $T as AccountList}
    <tr>        
        <td class="center">{ $T.AccountList.Name }</td>
        <td class="center">{ $T.AccountList.Point }</td>
        <td class="center">{ $T.AccountList.Grade }</td>
        <td class="center">{ $T.AccountList.Place }</td>
        <td class="center">{ $T.AccountList.IsFinishName }</td>
        <td class="center">{ $T.AccountList.StartDate } ~ { $T.AccountList.EndDate } </td>      
        <td class="center"><a class="btn" onclick="EduInfo.Del('{ $T.AccountList.CompanyID }','{ $T.AccountList.EducationID }')">{ $T.AccountList.BtnDel }</a></td>          
    </tr>
    {#else}
    <tr>
        <td colspan="7" class="center"><span id="NoListData" /></td>        
    </tr>
    {#/for}        
 </table>
