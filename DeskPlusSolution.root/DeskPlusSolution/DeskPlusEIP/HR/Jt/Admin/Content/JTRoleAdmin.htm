<table class="table_typeA"> 
<colgroup>   
    <col width="40px" />
    <col width="200px" />
    <col width="100px" />
    <col width="100px" />
    <col width="100px" />
    <col  />
</colgroup>
<tr>
    <th class="center"><input id="cbxAll" type="checkbox" onclick="RoleAdmin.Checked()" /></th>
    <th id="r_deptname" class="center"></th>
    <th id="r_username" class="center"></th>
    <th id="r_titlename" class="center"></th>
    <th id="r_dutyname" class="center"></th>
    <th id="r_Department" class="center"></th>    
</tr>
{#foreach $T as RoleAdmin}
<tr>
    <td class="center"><input type="checkbox" class="cbxID" id="cbxID{ $T.RoleAdmin.CompanyID }_{ $T.RoleAdmin.RoleID }_{ $T.RoleAdmin.UserID }_{ $T.RoleAdmin.Types }" value="{ $T.RoleAdmin.CompanyID }_{ $T.RoleAdmin.RoleID }_{ $T.RoleAdmin.UserID }_{ $T.RoleAdmin.Types }" /></td>
    <td class="center"><a  onclick="javascript:RoleAdmin.SelectUserPop('{$T.RoleAdmin.UserName}|{$T.RoleAdmin.UserID}')" style="cursor:pointer" >{ $T.RoleAdmin.DeptName }</a></td>
    <td class="center"><a  onclick="javascript:RoleAdmin.SelectUserPop('{$T.RoleAdmin.UserName}|{$T.RoleAdmin.UserID}')" style="color:#00c; text-decoration: underline; cursor:pointer" >{ $T.RoleAdmin.UserName }</a></td>
    <td class="center"><a  onclick="javascript:RoleAdmin.SelectUserPop('{$T.RoleAdmin.UserName}|{$T.RoleAdmin.UserID}')" style="cursor:pointer" >{ $T.RoleAdmin.TitleName }</a></td>
    <td class="center"><a  onclick="javascript:RoleAdmin.SelectUserPop('{$T.RoleAdmin.UserName}|{$T.RoleAdmin.UserID}')" style="cursor:pointer" >{ $T.RoleAdmin.DutyName }</a></td>
    <td class="center">{ $T.RoleAdmin.ViewDeptName }</td>    
</tr>
{#else}
<tr>
    <td colspan="6" class="center"><span class="NoListData" /></td>        
</tr>
{#/for}
</table>
