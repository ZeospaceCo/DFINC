<table class="table_typeB"> 
    <caption>
        ipAccessControl
    </caption>
    <colgroup>
        <col />
        <col width="80px" />
    </colgroup>
    <tr>
        <th class="center" id="r_ip"></th>        
        <th class="center" id="r_delIP"></th>
    </tr>
    {#foreach $T as List}
    <tr>
        <td class="center">
            { $T.List.StartIP1 }.{ $T.List.StartIP2 }.{ $T.List.StartIP3 }.{ $T.List.StartIP4 } ~ { $T.List.EndIP1 }.{ $T.List.EndIP2 }.{ $T.List.EndIP3 }.{ $T.List.EndIP4 }
        </td>
        <td class="center">
            <a class="btn" onclick="WorkAdmin.DelIP('{ $T.List.IPID }')" style="display:inline-block;"><span class="btn_del"></span></a>
        </td>
    </tr>
    {#else}
    <tr>
        <td class="center" colspan="2">
            <span class="NoListData" />
        </td>
    </tr>
    {#/for}       
</table>
