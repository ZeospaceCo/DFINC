<table class="tbl_type" border="1" cellspacing="0">
<caption>
    리스트
</caption>
<tr>    
    <th style="min-width:300px" id="r_ctitle"></th>
    <th width="75px" id="r_crequester"></th>
    <th width="75px" id="r_ctoname"></th>
</tr>
{#foreach $T as List}
<tr>    
    <td class="suj"><div class="w_dot"></div>            
        <a onclick="Main.View('{ $T.List.ListID }','{ $T.List.GroupID }','{ $T.List.ViewerCount }');return false;" style="cursor:pointer">
        {$T.List.Title }</a>
        {#if $T.List.ShowNew == 'Y'}&nbsp;<span class="i_new"></span>{#/if} 
        {#if $T.List.ReplyCnt > 0}
        <span>({ $T.List.ReplyCnt })</span>        
        {#/if}
    </td>
    <td class="center"><a onclick="AccountInfo('{ $T.List.WriteUserID }');return false;"><span class="name">{ $T.List.NameBase }</span></a></td>  
    <td class="center"><a onclick="AccountInfo('{ $T.List.TOUserID }');return false;"><span class="name">{ $T.List.TONameBase }{#if $T.List.TOCnt > 1}+{#/if}</span></a></td>  
</tr>
{#else}
<tr>
    <td colspan="3" class="center"><span id="C_NoListData" /></td>        
</tr>
{#/for}        
</table>
