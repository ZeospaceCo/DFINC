<table class="table_typeT">
<caption>근거문서</caption>
<colgroup>
    <col width="50px" />
    <col  />
    <col width="65px" />    
    <col width="60px" />  
    <col width="90px" />    
    <col width="90px" />
    <col width="45px" />
</colgroup>
<thead>
    <tr>
        <th id="r_num"></th>
        <th id="r_title"></th>
        <th class="center" id="r_status"></th>
        <th class="center" id="r_requester"></th>
        <th class="center" id="r_requestdate"></th>
        <th class="center" id="r_enddate"></th> 
        <th id="r_add"></th>
    </tr>
</thead>
<tbody>
{#foreach $T as List}
    <tr>     
        <td>{#if $T.List.IsGubun == '2'} <span class="IsGubun2"></span>
         {#else} <span class="IsGubun1"></span>
         {#/if}
        </td>
        <td>
            <a onclick="Common.TaskViewer('{ $T.List.ListID }','{ $T.List.GroupID }');return false;" style="cursor:pointer; {#if $T.List.ViewerCount == '0'}font-weight:bold{#/if}">
            { $T.List.Title }</a>          
            {#if $T.List.ShowNew == 'Y'}&nbsp;<span class="i_new"></span>{#/if} 
            {#if $T.List.ReplyCnt > 0}
            <span class="icon_Comment_view">({ $T.List.ReplyCnt })</span>        
            {#/if}
        </td>
        <td class="center">{ $T.List.Status }</td>    
        <td class="center">
        <a onclick="AccountInfo('{ $T.List.WriteUserID }');return false;"><span class="name">{ $T.List.NameBase }</span></a>
        </td>  
        <td class="center">{ $T.List.RequestDate }</td>    
        <td class="center">{ $T.List.EndDate }</td>
        <td>
            <a onclick="BaseTaskList.Add('{ $T.List.ListID }','{ $T.List.GroupID }', '{ $T.List.TaskNumber }', '{ $T.List.Title }');return false;">
            &nbsp;<img class="BtnAdd" alt=""/>
            </a>
        </td>   
    </tr>
{#else}
    <tr>
        <td colspan="7" class="center"><span class="NoListData" /></td>        
    </tr>
{#/for} 
</tbody>
</table>
