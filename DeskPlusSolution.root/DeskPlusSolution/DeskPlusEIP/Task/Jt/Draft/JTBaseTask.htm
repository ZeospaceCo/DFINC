<table class="table_typeT">
<caption>근거문서</caption>
<colgroup>
    <col />    
    <col width="90px" />
</colgroup>
<thead>
    <tr>
        <th><span id="j_baseTasktitle"></span></th>        
        <th><span id="j_baseTaskdel"></span></th>
    </tr>
</thead>
<tbody>
    {#foreach $T as List}
    <tr>
        <td>{ $T.List.Name }</td>        
        <td class="center"><a href="#" onclick="javascript:DelBaseTask('{ $T.List.DraftID }', '{ $T.List.BaseTaskID }')" style="display:inline-block;"><span class="btn_file_del" title="Delete"></span></a></td>
    </tr>
    {#else}
    <tr>
        <td colspan="2" class="center"><span class="NoBaseTaskListData" /></td>
    </tr>
    {#/for}
</tbody>
</table>
