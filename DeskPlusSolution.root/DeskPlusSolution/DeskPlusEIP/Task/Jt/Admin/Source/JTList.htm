<table class="table_typeA">
<caption>출처관리 리스트</caption>
<colgroup>
    <col width="*" />
    <col width="80px" />
</colgroup>
<thead>
    <tr>
        <th class="r_group"></th>
        <th class="r_active"></th>
    </tr>
</thead>
<tbody>
{#foreach $T as List}
    <tr>     
        <td class="center"><a onclick="List.GetSource('{ $T.List.SourceID }');return false;" style="cursor:pointer" >{ $T.List.SourceName }</a></td>       
        <td class="center"><span class="Active_{ $T.List.IsActive }">{ $T.List.IsActive }</span></td>
    </tr>
{#else}
    <tr>
        <td colspan="2" class="center"><span class="NoListData" /></td>        
    </tr>
{#/for} 
</tbody>
</table>
