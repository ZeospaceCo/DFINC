<table class="table_typeA">
<caption>리스트</caption>
<colgroup>
    <col width="60px" />    
    <col />
    <col width="100px" />
    <col width="100px" />
</colgroup>
<thead>
    <tr>
        <th class="center" id="r_num"></th>
        <th class="center" id="r_subject"></th>        
        <th class="center" id="r_name"></th>
        <th class="center" id="r_writedate"></th>
        
    </tr>  
</thead>
<tbody>
    {#foreach $T as List}
    <tr>
        <td class="center">{ $T.List.Row }</td>
        <td>
        <a href="#" onclick="List.View('{ $T.List.TemplateID }');return false;" style="cursor:pointer" >
        { $T.List.Subjects }
        </a>
        </td>
        <td class="center">
        <a onclick="AccountInfo('{ $T.List.WriteUserID }');return false;" style="cursor:pointer">
        { $T.List.NameBase }
        </a>
        </td>
        <td class="center">{ $T.List.WriteDateStr }</td>
    </tr>
    {#else}
    <tr>
        <td colspan="4" class="center"><span class="NoListData" /></td>
    </tr>
    {#/for}
</tbody>
</table>
