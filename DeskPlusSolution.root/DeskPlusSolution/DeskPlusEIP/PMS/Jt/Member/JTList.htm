<table class="table_typeA">
<caption>리스트</caption>
<colgroup>    
    <col width="20%"  />    
    <col width="15%" />
    <col width="20%" />
    <col width="20%" />
    <col width="20%" />
</colgroup>
<thead>
    <tr>
        <th class="center"><span id="r_status"></span></th>
        <th class="center"><span id="r_name"></span></th>
        <th class="center"><span id="r_dept"></span></th>
        <th class="center"><span id="r_writedate"></span></th>
        <th class="center"><span id="r_visiteddate"></span></th>
    </tr>  
</thead>
<tbody>
     {#foreach $T as List}
    <tr>        
        <td class="center">{ $T.List.StatusStr }</td>
        <td class="center">
        <a href="#" onclick="AccountInfo('{ $T.List.UserID }');return false;" style="cursor:pointer">
        { $T.List.NameBase }
        </a>
        </td>
        <td class="center">{ $T.List.TitleBase }</td>
        <td class="center">{ $T.List.RegisterDateStr }</td>
        <td class="center">{ $T.List.VisitedDateStr }</td>
    </tr>
    {#else}
    <tr>
        <td colspan="5" class="center"><span class="NoListData" /></td>
    </tr>
    {#/for}
</tbody>
</table>
