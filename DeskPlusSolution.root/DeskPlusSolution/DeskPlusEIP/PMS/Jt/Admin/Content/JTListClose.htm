<table class="table_typeA">
<caption>리스트</caption>
<colgroup>
    <col width="30px" />
    <col  />    
    <col width="200px" />
    <col width="100px" />
    <col width="100px" />
    <col width="100px" />
    <col width="65px" />
    <col width="65px" />
</colgroup>
<thead>
    <tr>
        <th class="center"><input id="cbxAll" type="checkbox" onclick="ListClose.Checked()" /></th>
        <th class="center"><span id="r_projectname"></span></th>
        <th class="center"><span id="r_deptname"></span></th>
        <th class="center"><span id="r_maker"></span></th>
        <th class="center"><span id="r_startdate"></span></th>
        <th class="center"><span id="r_enddate"></span></th>
        <th class="center"><span id="r_status"></span></th>
        <th class="center"><span id="r_process"></span></th>
    </tr>  
</thead>
<tbody>
    {#foreach $T as List}
    <tr>
        <td class="center"><input type="checkbox" class="cbxID" id="cbxID{ $T.List.ProjectID }" value="{ $T.List.ProjectID }" /></td>
        <td class="center">{ $T.List.SubjectBase }</td>
        <td class="center">{ $T.List.DeptBase }</td>
        <td class="center">
            {#if $T.List.WriteUserID > 0}
                <a href="#" onclick="AccountInfo('{ $T.List.WriteUserID }');return false;" style="cursor:pointer">{ $T.List.NameBase }</a>             
            {#else}
            { $T.List.NameBase }
            {#/if}
        </td>
        <td class="center">{ $T.List.PlanStartDateStr }</td>
        <td class="center">{ $T.List.PlanEndDateStr }</td>
        <td class="center">{ $T.List.StatusStr }</td>
        <td class="center">{ $T.List.Process }%</td>
    </tr>
    {#else}
    <tr>
        <td colspan="8" class="center"><span class="NoListData" /></td>
    </tr>
    {#/for}
</tbody>
</table>
