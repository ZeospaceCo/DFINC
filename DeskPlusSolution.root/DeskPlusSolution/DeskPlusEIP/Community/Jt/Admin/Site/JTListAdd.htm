<table class="table_typeA"> 
<caption>
    Community Comfirm List
</caption>
<colgroup>
    <col width="40px" />
    <col width="50px" />
    <col width="200px" />
    <col width="120px" />
    <col width="400px" />
    <col width="80px" />
    <col width="100px" />
</colgroup>
<tr>
    <th class="center"><input id="cbxAll" type="checkbox" onclick="ListAdd.Checked()" /></th>
    <th class="center" id="r_number"></th>    
    <th class="center" id="r_communityName"></th>
    <th class="center" id="r_writeUserName"></th>
    <th class="center" id="r_description"></th>                            
    <th class="center" id="r_type"></th>
    <th class="center" id="r_date"></th>

</tr>
{#foreach $T as CmnList}
<tr>
    <td class="center"><input type="checkbox" class="cbxID" id="cbxID{ $T.CmnList.ApplyID }" value="{ $T.CmnList.ApplyID }" /></td>
    <td class="center">{ $T.CmnList.ROW }</td>
    <td class="center">{ $T.CmnList.Name }</td>
    <td class="center">
        {#if $T.CmnList.WriteUserID > 0}
        <a href="#" onclick="AccountInfo('{ $T.CmnList.WriteUserID }');return false;" style="cursor:pointer">{ $T.CmnList.WriteUserName }</a>             
        {#else}
        { $T.CmnList.WriteUserName }
        {#/if}
    </td>
    <td>{ $T.CmnList.Description }</td>
    <td class="center">{ $T.CmnList.TypeName }</td>
    <td class="center">{ $T.CmnList.WriteDate }</td>
</tr>
{#else}
<tr>
    <td colspan="7" class="center"><span class="NoListData" /></td>        
</tr>
{#/for}        
</table>
