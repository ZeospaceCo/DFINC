<table class="table_typeA"> 
<caption></caption>
<colgroup>
    <col width="*" />
    <col width="100px" />
    <col width="100px" />
    <col width="100px" />
</colgroup>
<thead>
    <th id="j_DeptName"></th>
    <th id="j_TitleName"></th>
    <th id="j_Name"></th>
    <th id="j_RegDate"></th>
</thead>
<tbody>
{#foreach $T as BoaView}
<tr>
    <td class="center">{ $T.BoaView.DeptName }</td>
    <td class="center">{ $T.BoaView.TitleName }</td>
    <td class="center">{ $T.BoaView.UserName }</td>
    <td class="center">{ $T.BoaView.ViewDate }</td> 
</tr>
{#else}
<tr>
    <td colspan="4" class="center"><span class="NoListData" /></td>        
</tr>
{#/for}        
</tbody>
</table>
