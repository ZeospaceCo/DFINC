<table class="table_typeT">
<colgroup>
    <col width="120px" />
    <col />
    <col width="100px" />
    <col width="80px" />
</colgroup>
    <tr>
        <th id="j_Name"></th>
        <th id="j_Content"></th>
        <th id="j_RegDate"></th>
        <th></th>
    </tr>
    {#foreach $T as RepleList}
    <tr>
        <td class="center">
            { $T.RepleList.UserName }
        </td>
        <td>
            <span id="contentInfo{ $T.RepleList.ShortReplyID }">{ $T.RepleList.Content } </span>
            {#if $T.RepleList.ShowNew == 'Y'} <img class="BtnNew" alt="" />{#/if}
        </td>
        <td class="center">
            { $T.RepleList.WriteDate }
        </td>
        <td class="center">
            {#if $T.RepleList.IsAuth == 'Y'} 
            <a href="#" onclick="javascript:ShortReplyList.DelReple('{ $T.RepleList.ShortReplyID}', '{ $T.RepleList.UserID}')")><span class="r_del"></span></a>
            {#/if}
        </td>
    </tr>
    {#else}
    <tr>
        <td colspan="4" class="center"><span class="NoListData" /></td>
    </tr>
    {#/for}
</table>
