
<ul class="table_typeT ul_typeT">
    {#foreach $T as FileList}
    <li>
        {#if $T.FileList.ImageType == '1'}
        <span class="j_screenshot"></span>
        <span class="mount" style="position:relative; display:inline-block;width:20px; padding-left:4">
        <input type="radio" class="radioSpoolFile" name="radioSpoolFile" value="{ $T.FileList.FileName }" style=" position:absolute; top:-11px;" />
        </span>
        /
        {#/if}
        <span>{ $T.FileList.FileName }</span>
        <span class="mount">{ $T.FileList.FileLengthKB }</span>
        <a href="#" onclick="javascript:DelSpoolPath('{ $T.FileList.FileName }')" style="display:inline-block;" title="{ $T.FileList.FileDel }"><i class="fas fa-times-circle"></i></a>
    </li>
    {#else}
    <li></li>
	{#/for}
</ul>
