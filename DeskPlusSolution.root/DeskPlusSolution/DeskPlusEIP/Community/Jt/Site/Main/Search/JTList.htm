<table class="table_typeA"> 
<caption>
    Community Comfirm List
</caption>
<colgroup>
    <col width="40px" />
    <col width="50px" />
    <col width="*" />
    <col width="150px" />
    <col width="100px" />
    <col width="100px" />

</colgroup>
<tr>
    <th class="center"><input id="cbxAll" type="checkbox" onclick="List.Checked()" /></th>
    <th class="center" id="r_number"></th>    
    <th class="center" id="r_userName"></th>
    <th class="center" id="r_memberType"></th>
    <th class="center" id="r_joinDate"></th>
    <th class="center" id="r_point"></th>

</tr>
{#foreach $T as CmnList}
<tr>
    <td class="center"><input type="checkbox" class="cbxID" id="cbxID{ $T.CmnList.UserID }" value="{ $T.CmnList.UserID }" /></td>
    <td class="center">{ $T.CmnList.ROW }</td>
    <td class="center">
        {#if $T.CmnList.UserID > 0}
        <a href="#" onclick="List.GetMemberInfo('{ $T.CmnList.UserID }');return false;" style="cursor:pointer">{ $T.CmnList.UserName }</a>             
        {#else}
        { $T.CmnList.UserName }
        {#/if}
    </td>
    <td class="center">
        { $T.CmnList.GubunName }
    </td>
    <td class="center">{ $T.CmnList.JoinDate }</td>
    <td class="center">{ $T.CmnList.Point }</td>
</tr>
{#else}
<tr>
    <td colspan="6" class="center"><span class="NoListData" /></td>        
</tr>
{#/for}        
</table>
