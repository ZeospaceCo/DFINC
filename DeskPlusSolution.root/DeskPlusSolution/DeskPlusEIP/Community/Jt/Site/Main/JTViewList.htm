<table class="table_typeA"> 
<caption></caption>
<colgroup>
    <col width="150px" />
    <col />
    <col width="60px" />
</colgroup>
<tr>
    <th id="r_viewMenu"></th>
    <th id="r_viewTitle"></th>  
    <th id="r_viewCnt"></th>  
</tr>
{#foreach $T as CmnBoardList}
<tr>
    <td class="center">{ $T.CmnBoardList.MenuName }</td>
    <td>        
        <a href="#" onclick="Content.View('{ $T.CmnBoardList.CommunityID }','{ $T.CmnBoardList.MenuID }','{ $T.CmnBoardList.BoardID }');return false;" style="cursor:pointer" >{ $T.CmnBoardList.Title }</a>  
        {#if $T.CmnBoardList.ReplyCount > 0}        
        <a href="#" onclick="Content.PopupShort('{ $T.CmnBoardList.CommunityID }','{ $T.CmnBoardList.MenuID }','{ $T.CmnBoardList.BoardID }');return false;" style="cursor:pointer" >
        <span class="icon_Comment_view">({ $T.CmnBoardList.ReplyCount })</span>
        </a>
        {#/if}
        {#if $T.CmnBoardList.ShowNew == 'Y'} <img class="BtnNew" alt="" />{#/if}           
    </td>
    <td class="center">
        <a onclick="Content.ReadList('{ $T.CmnBoardList.CommunityID }','{ $T.CmnBoardList.MenuID }','{ $T.CmnBoardList.BoardID }');return false;" style="cursor:pointer" >{ $T.CmnBoardList.ViewListCount }</a>
     </td>
</tr>
{#else}
<tr>
    <td colspan="3" class="center"><span class="NoViewListData" /></td>        
</tr>
{#/for}        
</table>
