<table class="table_typeA">
    <caption>대상자리스트</caption>
    <colgroup>
        <col />
        <col />
        <col width="100px" />
        <col width="100px" />
        <col width="80px" />
        <col width="100px" />
    </colgroup>
    <thead>
        <tr>
            <th>사업장</th>
            <th>부서명</th>
            <th>직위명</th>
            <th>성명</th>
            <th>진행상태</th>
            <th>완료일</th>
        </tr>
    </thead>
    <tbody>
    {#foreach $T as TargetUser}
        <tr>
            <td class="center">{ $T.TargetUser.WorkplaceName }</td>
            <td class="center">{ $T.TargetUser.DeptName }</td>
            <td class="center">{ $T.TargetUser.TitleName }</td>
            <td class="center">{ $T.TargetUser.UserName }</td>
            <td class="center">{ $T.TargetUser.StatusStr }</td>
            <td class="center">{ $T.TargetUser.CompleteDateStr }</td>
        </tr>
    {#else}
        <tr>
            <td colspan="6" class="center">대상자가 없습니다.</td>
        </tr>
    {#/for}
    </tbody>
</table>
