
<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
	<title>Charting</title>
	<link href="/DeskPlusEIP/Html/Js/Chart/VisualChart/basic.css" type="text/css" rel="stylesheet" />
	<script type="text/javascript" src="/DeskPlusEIP/Html/Js/Chart/VisualChart/enhance.js"></script>	
	<script type="text/javascript">
	    // Run capabilities test
	    enhance({
	        loadScripts: [
				{ src: '/DeskPlusEIP/Html/Js/Chart/VisualChart/excanvas.js', iecondition: 'all' },
				'/DeskPlusEIP/Html/Js/jQuery/jquery.js',
				'/DeskPlusEIP/Html/Js/Chart/VisualChart/visualize.jQuery.js',
				'/DeskPlusEIP/Html/Js/Chart/VisualChart/Default.js'
			],
	        loadStyles: [
				'/DeskPlusEIP/Html/Js/Chart/VisualChart/visualize.css',
				'/DeskPlusEIP/Html/Js/Chart/VisualChart/visualize-dark.css'
			]
	    });	    

    </script>

</head>
<body>

<table >
	<caption>2009 Employee Sales by Department</caption>
	<thead>
		<tr>
			<td></td>
			<th scope="col">food</th>
			<th scope="col">auto</th>
			<th scope="col">household</th>
			<th scope="col">furniture</th>
			<th scope="col">kitchen</th>
			<th scope="col">bath</th>
		</tr>
	</thead>
	<tbody>
		<tr>
			<th scope="row">Mary</th>
			<td>190</td>
			<td>160</td>
			<td>40</td>
			<td>120</td>
			<td>30</td>
			<td>70</td>
		</tr>
		<tr>
			<th scope="row">Tom</th>
			<td>3</td>
			<td>40</td>
			<td>30</td>
			<td>45</td>
			<td>35</td>
			<td>49</td>
		</tr>
		<tr>
			<th scope="row">Brad</th>
			<td>10</td>
			<td>180</td>
			<td>10</td>
			<td>85</td>
			<td>25</td>
			<td>79</td>
		</tr>
		<tr>
			<th scope="row">Kate</th>
			<td>40</td>
			<td>80</td>
			<td>90</td>
			<td>25</td>
			<td>15</td>
			<td>119</td>
		</tr>		
	</tbody>
</table>	

</body>
</html>
