
<ul class="table_typeT ul_typeT">
    {#foreach $T as FileList}
    <li>
        <span>{ $T.FileList.FileName }</span>
        <span class="mount">{ $T.FileList.FileLengthKB }</span>
        <a href="#" onclick="javascript:DelSpoolPath('{ $T.FileList.FileName }')" style="display:inline-block;" title="{ $T.FileList.FileDel }"><i class="fas fa-times-circle"></i></a>
    </li>
    {#else}
    <li></li>
	{#/for}
</ul>
