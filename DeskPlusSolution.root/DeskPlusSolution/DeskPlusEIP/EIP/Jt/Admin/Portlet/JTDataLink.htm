<table class="table_typeT"> 
    <caption>
        Parameter
    </caption>
    <colgroup>
        <col width="100px" />
        <col width="120px" />
        <col width="120px" />
        <col width="100px" />
        <col width="*" />
        <col width="200px" />
        <col width="80px" />
    </colgroup>
    <tr>
        <th class="center" id="r_encripttype"></th>
        <th class="center" id="r_encriptvalue"></th>
        <th class="center" id="r_targettype"></th>
        <th class="center" id="r_targetdatetype"></th>
        <th class="center" id="r_linkname"></th>
        <th class="center" id="r_linkevalue"></th>
        <th class="center" id="r_del"></th>
    </tr>
    {#foreach $T as List}
    <tr>
        <td class="center">
            { $T.List.EncriptType }
        </td>
        <td class="center">
            { $T.List.EncriptValue }
        </td>
        <td class="center">
            { $T.List.TargetType }
        </td>
        <td class="center">
            { $T.List.TargetDataType }
        </td>
        <td class="center">
            { $T.List.LinkName }
        </td>
        <td class="center">
            { $T.List.LinkValue }
        </td>
        <td class="center">
            <a onclick="Mod.DelDataLink('{ $T.List.PortletDataLinkID }')" style="display:inline-block;" class="btn"><span class="btn_del"></span></a>
        </td>
    </tr>
    {#else}
    <tr>
        <td class="center" colspan="7">
            <span class="NoListData" />
        </td>
    </tr>
    {#/for}       
</table>
