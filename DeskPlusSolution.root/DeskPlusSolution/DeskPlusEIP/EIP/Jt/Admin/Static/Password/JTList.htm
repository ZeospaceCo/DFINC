 <table cellspacing="0" class="table_typeA"> 
    <caption>
        로그인 실패 리스트
    </caption>
    <colgroup>
        <col width="*" />
        <col width="100px" />
        <col width="120px" />
        <col width="150px" />
        <col width="160px" />
    </colgroup>
    <tr>
        <th id="r_dept"></th>
        <th id="r_title"></th>
        <th id="r_name"></th>
        <th id="r_ip"></th>
        <th id="r_accessTime"></th>
    </tr>
    {#foreach $T as PasswordList}
    <tr>
        <td class="center">{ $T.PasswordList.DeptName }</td>
        <td class="center">{ $T.PasswordList.TitleName }</td>
        <td class="center">
            {#if $T.PasswordList.UserID > 0}
                <a onclick="AccountInfo('{ $T.PasswordList.UserID }');return false;" style="cursor:pointer">{ $T.PasswordList.UserName }</a>             
            {#else}
            { $T.PasswordList.UserName }
            {#/if}
        </td>
        <td class="center">{ $T.PasswordList.IPAddress }</td>
        <td class="center">{ $T.PasswordList.AccessTimeStr }</td>        
    </tr>
    {#else}
     <tr>
        <td colspan="5" class="center"><span class="NoListData" /></td>        
     </tr>
    {#/for}  
 </table>
