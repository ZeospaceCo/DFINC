<div class="table_typeLmiddle" style="min-height:405px;height: 410px;overflow:auto;">
    <!--포틀릿 내용 시작-->
    {#foreach $T as PortletList}
    <div class="blog_cont">
       
            <table style="width:100%;" >
				<caption>Portlet Setting</caption>
                <colgroup>
                    <col width="120px" />
                    <col />
                    <col width="150px" />
                </colgroup>
                <tr style="border-bottom:1px solid #e9e9e9;">
                    <td><img src='{ $T.PortletList.PhotoName }' alt="img" style="width: 120px; height: 60px;" /></td>
                    <td style="vertical-align:middle;"><span style="font-weight: bold;">[{ $T.PortletList.TitleName }]</span></td>
                    <td style="padding-right:10px;vertical-align:middle;">
                            <span class="subDate">  
                            <table border="1">
                                <colgroup>
                                    <col width="60px" />
                                    <col width="80px" />
                                </colgroup>
                            <tr>
                                <td style="vertical-align:middle">
                                {#if $T.PortletList.PortletIDCnt == "0"}
                                <span style="float:left;"><select id='selLayout_{ $T.PortletList.PortletID }' class="searchselect form-control"></select></span>
                                {#/if}
                                </td>
                                <td style="vertical-align:middle">
                                            {#if $T.PortletList.PortletIDCnt == "0"}
                                            <a href="#" onclick="GetPortlet.Confirm('{ $T.PortletList.PortletID }','selLayout_{ $T.PortletList.PortletID }');" class="btn btn-secondary"><span class="DirectAdd"></span></a>
                                            {#else}
                                            <a href="#" class="btn btn-secondary"><span class="DirectAdd"></span></a>
                                            {#/if}
   
                                </td>
                            </tr>
                            </table>
                            </span>                             
                    </td>
                </tr>
            </table>
    </div>
   {#else}
   <div class="blog_cont">
        <ul>            
            <table class="blog_cont_table">
				<caption>Portlet Setting</caption>
                <colgroup>
                    <col />
                </colgroup>
                <tr><td class="center"><span id="NoListData" /></td></tr>
            </table>
        </ul>
    </div>
   {#/for}
</div>
