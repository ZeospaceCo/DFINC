<ul class="table_typeT ul_typeT">
    {#foreach $T as FileList}
        <li>{ $T.FileList.FileName } <span class="mount">{ $T.FileList.FileLengthKB }</span>
        <a onclick="javascript:DelSpoolPath('{ $T.FileList.FileName }')" title="{ $T.FileList.FileDel }"><i class='fas fa-times-circle'></i></a>
    	</li>
    {#else}
    <li></li>
    {#/for}
</ul>
