<table class="table_typeA"> 
<caption>
</caption>
<colgroup>    
    <col />
    <col />
    <col />
    <col />
    <col width="40px" />
    <col width="40px" />
    <col width="60px" />
</colgroup>
<tr>    
    <th class="center" id="r_areacode"></th>  
    <th class="center" id="r_faxnum"></th>
    <th class="center" id="r_pagecnt"></th>                              
    <th class="center" id="r_recvtime"></th>
    <th class="center" id="r_view"></th>
    <th class="center" id="r_print"></th>
    <th class="center" id="r_download"></th>
</tr>
{#foreach $T as RecvList}
<tr>    
    <td class="center">{ $T.RecvList.AreaCode }</td>
    <td class="center">{ $T.RecvList.FaxNum }</td>    
    <td class="center">{ $T.RecvList.PageCnt }</td>    
    <td class="center">{ $T.RecvList.RecvTime }</td>    
    <td class="center"><a onclick="RecvList.ShowImage('{ $T.RecvList.FilePath }','{ $T.RecvList.PageCnt }');return false;" style="cursor:pointer"><img src="/DeskPlusEIP/Design/C/Img/Community/cm_cat_search.gif" alt="" title="" /></a></td>    
    <td class="center"><a onclick="RecvList.PrintImage('{ $T.RecvList.FilePath }','{ $T.RecvList.PageCnt }');return false;" style="cursor:pointer"><img src="/DeskPlusEIP/Design/C/Img/RM/ico_10.gif" alt="" title="" /></a></td>    
    <td class="center"><a onclick="RecvList.DownloadImage('{ $T.RecvList.DownloadFilePath }');return false;" style="cursor:pointer"><i class="fas fa-arrow-alt-circle-down"></i></a></td>    
</tr>
{#else}
<tr>
    <td colspan="7" class="center"><span class="NoListData" /></td>        
</tr>
{#/for}        
</table>
