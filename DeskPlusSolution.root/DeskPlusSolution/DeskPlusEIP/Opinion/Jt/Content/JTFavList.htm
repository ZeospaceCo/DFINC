<table class="table_typeA">
<caption>설문 리스트</caption>
<colgroup>
    <col width="20px" />
    <col />
    <col width="90px" />
    <col width="160px" />
    <col width="90px" />
    <col width="90px" />
    <col width="90px" />
    <col width="90px" />
</colgroup>
<thead>
<tr>
    <th class="center"></th>
    <th class="center"><a id="jtA_Title" href="#" onclick="javascript:FavList.Sort('Title','jtA_Title')"><span id="jtFL_F1"></span></a></th>
    <th class="center"><span id="jtFL_F2"></span></th>
    <th class="center"><span id="jtFL_F3"></span></th>
    <th class="center"><span id="jtFL_F4"></span></th>
    <th class="center"><span id="jtFL_F5"></span></th>
    <th class="center"><span id="jtFL_F6"></span></th>
    <th class="center"><span id="jtFL_F7"></span></th>
</tr>
</thead>
<tbody>
    {#foreach $T as List}
    <tr>
        <td class="center">
            <p class="fav">
                <input type="checkbox" id="chkImpo_{$T.List.QuesID}" 
                {#if $T.List.ImpoCnt == 1}checked="checked"{#/if}
                onclick="FavList.ModImpUser('chkImpo_{$T.List.QuesID}', this)" />
	            <label for="chkImpo_{$T.List.QuesID}" title="" 
                id="lbImpo_{$T.List.QuesID}" class="{#if $T.List.ImpoCnt == 1}on{#/if}">
                    <span class="blind"></span>
                </label>
            </p>
        </td>
        <td><a href="#" onclick="javascript:FavList.View('{ $T.List.QuesID }')" style="cursor:pointer" title="">{ $T.List.Title }</a></td>
        <td class="center">{ $T.List.VoteCnt }</td>
        <td class="center">{ $T.List.StartDateStr } ~ { $T.List.EndDateStr }</td>
        <td class="center">{ $T.List.IsOpenStr }</td>
        <td class="center">{ $T.List.IsReplyStr }</td>
        <td class="center">{ $T.List.IsVoteUserStr }</td>
        <td class="center">{ $T.List.IsSecretStr }</td>
    </tr>
    {#else}
    <tr>
        <td colspan="8" class="center"><span class="jtNoData"></span></td>
    </tr>
    {#/for}
</tbody>
</table>
