<table class="table_typeA"> 
<caption>
    나의 제안 보기
</caption>
<colgroup>
    <col width="100px" />
    <col width="100px" />
    <col />
    <col width="110px" />
    <col width="100px" />
</colgroup>
<tr>
    <th class="center">접수번호</th>
    <th class="center">접수일자</th>
    <th class="center">제안 제목</th>
    <th class="center">진행 상황</th>
    <th class="center">등급</th>
</tr>

{#foreach $T as BoardList}
<tr>
    <td class="center">
        <a onclick="MyList.View('{ $T.BoardList.ProposalNo }');return false;" style="cursor:pointer" >{ $T.BoardList.No }</a> 
    </td>
    <td class="center">{ $T.BoardList.WriteDateYMD }</td>
    <td>        
        <a onclick="MyList.View('{ $T.BoardList.ProposalNo }');return false;" style="cursor:pointer" >{ $T.BoardList.Title }</a> 
        
    </td>
    <td class="center">{ $T.BoardList.Status }</td>
    <td class="center">{ $T.BoardList.Grade }</td>
</tr>
{#else}
<tr>
    <td colspan="5" class="center"><span class="NoListData" />등록된 제안이 없습니다.</td>        
</tr>
{#/for}        
</table>
