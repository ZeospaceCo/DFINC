<table class="table_typeA">
<caption>대분류리스트</caption>
<colgroup>
    <col />
    <col width="100px" />
</colgroup>
<thead>
    <tr>
        <th class="center r_group"></th>
        <th class="center r_active"></th>
    </tr>
</thead>
<tbody>
{#foreach $T as ItemList}
    <tr>     
        <td>
            <a onclick="List.Item('{ $T.ItemList.ItemID }');return false;" style="cursor:pointer" >{ $T.ItemList.ItemName }</a>
        </td>
        <td class="center"><span class="Active_{ $T.ItemList.ActiveGroup }">{ $T.ItemList.ActiveGroup }</span></td>
    </tr>
{#else}
    <tr>
        <td colspan="2" class="center"><span class="NoListData" /></td>        
    </tr>
{#/for} 
</tbody>
</table>
