<ul class="table_typeT ul_typeT">
    {#foreach $T as FileList}
        <li><a onclick="javascript:FileDownload('{ $T.FileList.FilePath }','{ $T.FileList.FileName }','{ $T.FileList.FileGUID }')">{ $T.FileList.FileName }</a> <span class="mount">{ $T.FileList.FileLengthKB }</span>
        {#if $T.FileList.ApprovalState == 'C'} 
        {#else}
            <a onclick="javascript:FileDownload('{ $T.FileList.FilePath }','{ $T.FileList.FileName }','{ $T.FileList.FileGUID }');return false;" ><i class='btn_file_dw'></i></a>
        {#/if}
    	</li>
    {#else}
        <li></li>
    {#/for}
</ul>
