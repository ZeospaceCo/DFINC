<table class="table_typeA"> 
<colgroup>   
    <col width="200px" />
    <col width="100px" />
    <col width="100px" />
    <col width="100px" />
    <col  />
</colgroup>
<tr>
    <th id="r_deptname" class="center"></th>
    <th id="r_username" class="center"></th>
    <th id="r_titlename" class="center"></th>
