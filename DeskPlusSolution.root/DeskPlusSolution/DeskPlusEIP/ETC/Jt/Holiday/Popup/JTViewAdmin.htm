<table class="table_typeA"> 
<caption>
    휴가원(관리자) 휴가내역
</caption>
<colgroup>
    <col width="100px" />
    <col width="100px" />
    <col width="100px" />
    <col width="100px" />
    <col width="100px" />
    <col />
    <col width="90px" />
    <col width="90px" />
</colgroup>
<tr>
    <th id="r_startdate" class="center"></th>
    <th id="r_starthalf" class="center"></th>
    <th id="r_enddate" class="center"></th>
    <th id="r_endhalf" class="center"></th>
    <th id="r_duration" class="center"></th>
    <th id="r_gubun" class="center"></th>
    <th id="r_docview" class="center"></th>
    <th id="r_holidel" class="center"></th>    
</tr>
{#foreach $T as ViewAdmin}
<tr>  
    <td class="center">{ $T.ViewAdmin.StartDate }</td>
    <td class="center">{ $T.ViewAdmin.StartHalf }</td>
    <td class="center">{ $T.ViewAdmin.EndDate }</td>
    <td class="center">{ $T.ViewAdmin.EndHalf }</td>
    <td class="center">({ $T.ViewAdmin.Duration }일간)</td>
    <td class="center">{ $T.ViewAdmin.Gubun }</td>
    <td class="center">        
        {#if $T.ViewAdmin.DocumentID > 0}
        <span onclick="ViewAdmin.DocView('{ $T.ViewAdmin.DocumentID }');return false;" style="cursor:pointer">
            <img alt="" src="/DeskPlusEIP/Design/C/Img/Icon/doc_view.gif" />
        </span>
        {#/if}
    </td>
    <td class="center">
        {#if $T.ViewAdmin.UsedID > 0}
        <span onclick="ViewAdmin.DelHoli('{ $T.ViewAdmin.UsedID }')" style="cursor:pointer">
            <img alt="" src="/DeskPlusEIP/Design/C/Img/Icon/delete.gif" />
        </span>
        {#/if}        
    </td>    
</tr>
{#else}
<tr>
    <td colspan="8" class="center"><span class="NoListData" /></td>        
</tr>
{#/for}        
</table>
