<table class="tbl_type" border="1" cellspacing="0" >
<caption></caption>
<colgroup>    
    <col width="10px" />
    <col width="60px" />
    <col width="250px" />    
    <col width="240px" />
    <col />    
    <col width="40px" />
    <col width="80px" />
</colgroup>
<thead>
    <tr>
        <th colspan="2"><span id="r_dusable"></span></th>       
        <th><span id="r_dresourcesTitle"></span></th>        
        <th><span id="r_dreserveDate"></span></th>
        <th><span id="r_dsubject"></span></th>   
        <th><span id="r_dattach"></span></th>     
        <th><span id="r_dwriteuser"></span></th>        
    </tr>  
</thead>
<tbody>
    {#foreach $T as List}
    <tr>
        <td>{ $T.List.Usable }</td>
        <td class="left">{ $T.List.UsableStr }</td>
        <td><a href="#" onclick="AccountInfo('{ $T.List.ManagerUserID }');return false;" style="cursor:pointer">{ $T.List.Title }</a></td>                
        <td>{ $T.List.ReserveDate }</td>
        <td class="suj">
            <a href="#" onclick="javascript:Main.View('{ $T.List.ReservationID }')" style="cursor:pointer" >{ $T.List.Subject }</a>
            {#if $T.List.ReplyCount > 0}
            <span>({ $T.List.ReplyCount })</span>        
            {#/if}
        </td>        
        <td class="center">
        {#if $T.List.FileCount > 0}
        <i class="fas fa-arrow-alt-circle-down" action="attach" style="cursor:pointer" ListID='{ $T.List.ParentReservationID }'></i>
        {#/if}
        </td>  
        <td><a href="#" onclick="AccountInfo('{ $T.List.WriteUserID }');return false;" style="cursor:pointer">{ $T.List.WriteUserName }</a></td>
    </tr>
    {#else}
    <tr>
        <td colspan="7" class="center"><span id="DNoListData" /></td>
    </tr>
    {#/for}
</tbody>
</table>
