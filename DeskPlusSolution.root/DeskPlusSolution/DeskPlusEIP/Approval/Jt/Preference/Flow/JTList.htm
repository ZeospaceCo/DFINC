<table class="table_typeA"> 
<caption>개인결재선 관리</caption>
<colgroup>
    <col width="40px" />
    <col width="50px" />
    <col width="*"/>
    <col width="200px" />
    <col width="100px" />
</colgroup>
<tr>
    <th><input id="cbxAll" type="checkbox" onclick="List.Checked()"/></th>
    <th id="r_number" class="center"></th>
    <th id="r_subject" class="center"></th>
    <th id="r_memo" class="center"></th>
    <th id="r_addDate" class="center"></th>
</tr>
{#foreach $T as List}
<tr>
    <td class="center"><input type="checkbox" class="cbxID" id="cbxID{ $T.List.FavSeqID }" value="{ $T.List.FavSeqID }" /></td>    
    <td class="center">{ $T.List.RowStr }</td>
    <td><a href="" onclick="List.ModLine('{ $T.List.FavSeqID}');return false;" style="cursor:pointer" >{ $T.List.Subject }</a></td>
    <td>{ $T.List.Memo }</td>
    <td class="center">{ $T.List.WriteDateStr }</td>
</tr>
{#else}
<tr>
    <td colspan="5" class="center"><span id="r_noData" class="NoListData" /></td>        
</tr>
{#/for}        
</table>
