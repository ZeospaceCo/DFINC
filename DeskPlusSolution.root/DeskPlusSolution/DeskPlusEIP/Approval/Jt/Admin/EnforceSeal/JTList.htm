<table class="table_typeA">
<caption>양식관리</caption>
<colgroup>
    <col width="40px" />
    <col width="50px" /> 
    <col width="130px" /> 
    <col />
    <col width="100px" /> 
    <col width="100px" /> 
    <col width="90px" /> 
</colgroup>
<thead>
    <tr>
        <th class="center"><input type="checkbox" onclick="List.Checked()" id="cbxAll" /></th>
        <th class="center" id="r_num"></th>
        <th class="center" id="r_deptname"></th>
        <th class="center" id="r_exp"></th>
        <th class="center" id="r_isstampstr"></th>
        <th class="center" id="r_isadminstr"></th>
        <th class="center" id="r_writedate"></th>
    </tr>
</thead>
<tbody>
    {#foreach $T as List}
    <tr>
        <td class="center">
            <input type="checkbox" class="cbxID" id="cbxID{ $T.List.EnforceStampID }" value="{ $T.List.EnforceStampID }-{ $T.List.DeptID }" />
        </td>
        <td class="center">{ $T.List.ROW }</td>
        <td class="center"><a href="#" onclick="javascript:List.Mod('{ $T.List.EnforceStampID }', '{ $T.List.DeptID }')" style="cursor:pointer" title="">{ $T.List.DeptBase }</a></td>
        <td>{ $T.List.ExpFirstBase } / { $T.List.ExpMidBase } / { $T.List.ExpEndBase }</td>
        
        <td class="center">{ $T.List.IsStampStr }</td>
        <td class="center">{ $T.List.IsAdminStr }</td>
        <td class="center">{ $T.List.WriteDateStr }</td>
    </tr>
    {#else}
    <tr>
        <td colspan="7" class="center"><span class="NoListData" /></td>        
    </tr>
    {#/for}
</tbody>

</table>
