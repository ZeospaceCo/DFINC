<table class="table_typeA">
<caption></caption>
<colgroup>
    <col width="80px" />
    <col />
    <col width="80px" />
</colgroup>
<thead>
    <tr>
        <th class="center" id="r_deptID"></th>
        <th class="center" id="r_deptName"></th>
        <th class="center" id="r_deptCnt"></th>                    
    </tr>
</thead>
<tbody>
{#foreach $T as List}
    <tr>
        <td class="center">{ $T.List.DeptID }</td>
        <td class="center"><a href="#" onclick="GetGarbage.View('{ $T.List.DeptID }','{ $T.List.DeptBase }');return false;" style="cursor:pointer" >{ $T.List.DeptBase }</a></td>
        <td class="center">{ $T.List.ChildCount } <span class="cntUnit" /></td>
    </tr>
{#else}
    <tr>
        <td colspan="3" class="center"><span class="NoListData" /></td>        
    </tr>
{#/for} 
</tbody>
</table>
