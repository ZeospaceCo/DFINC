<table class="table_typeA">
<caption></caption>
<colgroup>
    <col width="50px" />
    <col width="120px" />
    <col width="250px" />
    <col width="400px"/>
    <col width="80px" />
    <col width="100px" />
    <col width="90px" />
</colgroup>
<thead>
    <tr>
        <th class="center" id="r_number"></th>
        <th class="center" id="r_reqNumber"></th>
        <th class="center" id="r_docNumber"></th>
        <th class="center" id="r_subject"></th>        
        <th class="center" id="r_req"></th>        
        <th class="center" id="r_state"></th>
        <th class="center" id="r_writetime"></th>        
    </tr>
</thead>
<tbody>
{#foreach $T as List}
    <tr>
        <td class="center">{ $T.List.ROW }</td>
        <td class="center">{ $T.List.ReqNumber }</td>
        <td class="center">{ $T.List.DocNumber }</td>
        <td>
            <a href="#" onclick="ListSubmit.Confirm('{ $T.List.EnforceID }');return false;" style="cursor:pointer" >{ $T.List.Subject }</a> 
            {#if $T.List.ShowNew == 'Y'} <img class="BtnNew" alt="" />{#/if}  
        </td>
        <td class="center">{ $T.List.StateStr }</td>
        <td class="center"><a onclick="AccountInfo('{ $T.List.ReqUserID }');return false;">{ $T.List.ReqNameBase }</a></td>
        <td class="center">{ $T.List.WriteDateStr }</td>        
    </tr>
{#else}
    <tr>
        <td colspan="7" class="center"><span class="NoListData" /></td>        
    </tr>
{#/for} 
</tbody>
</table>
