<table class="table_typeA">
<caption></caption>
<colgroup>
    <col width="50px" />
    <col width="120px" />
    <col width="120px" />
    <col width="400px"/>
    <col width="80px" />
    <col width="100px" />
    <col width="90px" />
    <col width="90px" />
</colgroup>
<thead>
    <tr>
        <th class="center" id="r_number"></th>
        <th class="center" id="r_reqNumber"></th>
        <th class="center" id="r_confirmNumber"></th>
        <th class="center" id="r_subject"></th>        
        <th class="center" id="r_issend"></th>        
        <th class="center" id="r_confirm"></th>
        <th class="center" id="r_writetime"></th>        
        <th class="center" id="r_confirmdate"></th>   
    </tr>
</thead>
<tbody>
{#foreach $T as List}
    <tr>
        <td class="center">{ $T.List.ROW }</td>
        <td class="center">{ $T.List.ReqNumber }</td>
        <td class="center">{ $T.List.ConfirmNumber }</td>
        <td>
            <span action="subject" style="cursor:pointer" enforceID='{ $T.List.EnforceID }'>{ $T.List.Subject }</span>
            {#if $T.List.ShowNew == 'Y'} <img class="BtnNew" alt="" />{#/if}  
        </td>
        <td class="center">{ $T.List.IsSendStr }</td>
        <td class="center"><a onclick="AccountInfo('{ $T.List.ConfirmUserID }');return false;">{ $T.List.ConfirmNameBase }</a></td>
        <td class="center">{ $T.List.WriteDateStr }</td>        
        <td class="center">{ $T.List.ConfirmDateStr }</td>        
    </tr>
{#else}
    <tr>
        <td colspan="8" class="center"><span class="NoListData" /></td>        
    </tr>
{#/for} 
</tbody>
</table>
