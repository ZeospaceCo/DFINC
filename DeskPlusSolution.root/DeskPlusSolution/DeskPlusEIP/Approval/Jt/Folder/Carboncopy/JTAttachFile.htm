<ul class="table_typeT ul_typeT">
	<li class="all_choice"><input type="checkbox" class="cbxAllFile" id="cbxAll" onclick="View.checkedAllValue()" /> <span id="j_selectall"></span></li>
    {#foreach $T as FileList}
    <li>
        <input type="checkbox" class="cbxFile" id="cbxFile{ $T.FileList.CirculationAttachFileID }" value="{ $T.FileList.CirculationAttachFileID }" />
        <a onclick="javascript:View.FileDownload('{ $T.FileList.FilePath }','{ $T.FileList.FileName }','{ $T.FileList.FileGUID }')">{ $T.FileList.FileName }</a>
        <span class="mount">{ $T.FileList.FileLengthKB }</span>
    </li>
    {#else}
    <li></li>
	{#/for}
</ul>
