<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="../../Design/ko/base/Css/DeskPlusEIPBase.css" type="text/css" media="screen" rel="stylesheet" />
<title>DeskPlus4.0 웹표준</title>
</head>
<body>
<div id="layout_header">
    <h1>메뉴관리</h1>
	<div class="list_add_style1">  
		<ul class="btn_right">        
			<li class="btn_blue"><a href="" title=""><span>사용자메뉴적용</span></a></li>
			<li class="btn_blue"><a href="" title=""><span>등록</span></a></li>    
		</ul>
	</div> 
</div>
<div id="layout_info">    
    <!-- 테이블 시작 -->
    <table class="table_typeK">
        <caption>
        메뉴관리
        </caption>
        
        <colgroup>
            <col width="15%"/>
            <col width="35%"/>
            <col width="15%"/>
            <col width="35%"/>
        </colgroup>
        <tbody>
            <tr>
                <th class="first-child">메뉴명</th>
                <td class="first-child"><input type="text" class="input_type2"/></td>
                <th class="first-child2">영문명</th>
                <td class="last-child"><span class="last-child3">
                    <input type="text" class="input_type2"/>
                </span></td>
            </tr>
            <tr>
                <th class="first-child3">메뉴설명</th>
                <td class="last-child3" colspan="3"><input type="text" class="input_type3"  /></td>
            </tr>
            <tr>
                <th class="first-child3">호출ID</th>
                <td class="last-child3" colspan="3"><input type="text" class="input_type3"  /></td>
            </tr>
            <tr>
            	<th class="first-child3">IP접근권한</th>
            	<td class="last-child3" colspan="3">&nbsp;</td>
           	</tr>
            <tr>
                <th class="first-child3">권한 및 역할지정</th>
                <td class="last-child3" colspan="3"><input type="text" class="input_type3"  /></td>
            </tr>
            <tr>
                <th class="first-child_btm">메뉴연결</th>
                <td class="last-child_btm" colspan="3"><div class="list_add_style4">
						<input type="radio" name="radio" value="radio" class="borderno"/>
						페이지 리스트 사용
						<input type="radio" name="radio" value="radio" class="borderno" />
						URL직접입력
					</div>
					<div class="clear">
					<textarea name="" cols="" rows=""></textarea>
					</div>
					
				</td>
            </tr>
        </tbody>
    </table>      
    <!-- 테이블 끝 -->
</div> 
</body>
</html>
