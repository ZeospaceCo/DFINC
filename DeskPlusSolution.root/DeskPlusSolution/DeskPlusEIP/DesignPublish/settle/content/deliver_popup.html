<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="../../Design/ko/base/Css/DeskPlusEIPBase.css" type="text/css" media="screen" rel="stylesheet" />
<title>DeskPlus4.0 웹표준</title>
</head>
<body>
<div class="layer_popup">
    <div class="top-left"></div>
    <div class="top-right"></div>
    <div class="inside">
        <div class="popup_header">
            <h5>전달대상지정</h5>
            <ul class="btn_right">
                <li><a href="" title=""><span>확인</span></a></li>
                <li class="btn_blue"><a href="" title=""><span>닫기</span></a></li>
            </ul>
        </div>
        <div class="dotLine"></div>
        <div class="popup_layout_style">
            <h6 class="h6_typeB dotBlack">전달대상자를 선택합니다</h6>
            <div class="clear"></div>
            <div class="security_left">
                <div class="tree_typeW2">
                    <div class="roundtable2_l_b">
                        <div class="roundtable2_l_t">
                            <div class="roundtable2_r_b">
                                <div class="roundtable2_r_t">
                                    <!--내용넣기-->
                                    <div class="list_add_style4"> 
                                    	<span class="input_type4_w">
                                        <input type="text" class="searchtext_type2" />
                                        </span> <a href="#" class="btn_style4">검색</a> <a href="#" class="btn_style4">취소</a> </div>
                                    <div class="clear"></div>
                                    <div class="tree"> 트리넣기 </div>
                                    <!--//내용넣기-->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="arrow"><img src="../../Design/ko/Base/Img/Btn/34_16x16.png" alt="옆으로" /></p>
            </div>
            <div class="security_right">
                <!-- 테이블 시작 -->
                <div class="table_typeAtop_left">
                    <p></p>
                </div>
                <table class="table_typeA">
                    <caption>
                    주소록 리스트
                    </caption>
                    <colgroup>
                    <col width="*">
                    <col width="10%">
                    <col width="10%">
                    <col width="10%">
                    <col>
                    </colgroup>
                    <thead>
                        <tr>
                            <th>부서명</th>
                            <th>직급/직책</th>
                            <th>이름</th>
                            <th>삭제</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>솔루션기술침</td>
                            <td>사원</td>
                            <td>김선민</td>
                            <td>삭제</td>
                        </tr>
                    </tbody>
                </table>
                <div class="table_typeAbottom_left">
                    <p></p>
                </div>
                <!-- 테이블 끝 -->
            </div>
            <div class="dotLine mt20"></div>
            <h6 class="h6_typeB dotBlack">전달의견</h6 >
            <textarea id="" rows="" cols="" class="opnion"></textarea>
            <p class="check_txt">
                <input type="checkbox" id="" />
                첨부파일/근거문서 포함. </p>
        </div>
    </div>
    <div class="bottom-left"></div>
    <div class="bottom-right"></div>
</div>
<!-- //layout_info -->
</body>
</html>
