<div id="layout_info">

	<div class="table_typeBtop_left"> <p></p></div>

			<caption>
			커뮤니티 정보
			</caption>
			<colgroup>
				<col>
				<col>
			</colgroup>
			<tbody>
				<tr>
					<th>이름</th>
					<td class="adTd">/</td>
				</tr> 
				<tr>
					<th>전자메일</th>
					<td class="adTd">@</td>
				</tr> 
				<tr>
					<th>커뮤니티 이름</th>
					<td class="adTd"><input type="text" value="" class="input_type3" /></td>
				</tr> 
				<tr>
					<th>커뮤니티 소개</th>
					<td class="adTd">ㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇㅇ</td>
				</tr> 
				<tr>
					<th>커뮤니티분류</th>
					<td class="adTd">
						<select id="">
							<option value="" selected="selected">커뮤니티</option>
							<option value=""></option>
						</select>

						<select id="">
							<option value="" selected="selected">커뮤니티 소분류</option>
							<option value=""></option>
						</select>
					</td>
				</tr> 
				<tr>
					<th class="last-child">회원가입유형</th>
					<td class="last-child adTd" style="">
                    	<div class="table_typeBtop_left"> <p></p></div>
						<table class="table_typeB">
							<caption>
							커뮤니티 정보
							</caption>
							<colgroup>
								<col>
								<col>
							</colgroup>
							<tbody>
								<tr>
									<th><input type="radio" id="" /> 공개</th>
									<td class="adTd">가입신청 즉시회원이 될 수 있습니다. </td>
								</tr> 
								<tr>
									<th><input type="radio" id="" /> 비공개</th>
									<td class="adTd">가입하려면 시삽에게 신청하고 시샵의 승인해야 회원이 될수 있습니다.</td>
								</tr> 
								<tr>
									<th class="last-child"><input type="radio" id="" /> 퀴즈</th>
									<td class="last-child adTd">

										<p>-질문 <input type="text" value="" class="input_type3" /></p>
										<p>-답변 <input type="text" value="" class="input_type3" /></p>
									</td>
								</tr>  
							</tbody>
						</table> 
                        <div class="table_typeBbottom_left"><p></p> </div>
