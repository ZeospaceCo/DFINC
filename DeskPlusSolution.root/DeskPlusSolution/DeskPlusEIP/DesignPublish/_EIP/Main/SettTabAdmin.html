<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link rel="stylesheet" type="text/css" href="/DeskPlusEIP/Design/Base/Css/DeskPlusEIPBase.css?v=1" />
<link rel="stylesheet" type="text/css" href="/DeskPlusEIP/Design/Base/Css/Func_EIP.css?v=1" />
<title>DeskPlus4.0 웹표준</title>
</head>
<body>


<div class="layer_popup">
    <div class="top-left"></div>
    <div class="top-right"></div>

    <div class="inside">
        <div class="popup_header">
            <h5>관리자 탭 설정</h5>
            <ul class="btn_right">
                <li class="btn_blue"><a href="" title=""><span>확인</span></a></li>
                <li><a href="" title=""><span>취소</span></a></li>
            </ul>
        </div>
        <div class="dotLine"></div>
        <div class="popup_layout_style3">
            
            
            <h2>탭구성</h2>
            <ul class="btn_right">
                <li><a href="#"><span>탭추가</span></a></li>
                <li><a href="#"><span>탭순서</span></a></li>
                <li class="btn_blue"><a href="#"><span>탭저장</span></a></li>
                <li class="btn_red"><a href="#"><span>탭삭제</span></a></li>
            </ul>
            
            <ul class="tab" >
                <li><a href="#tabs-1" class="tab_on" title="탭클릭 시, 저장여부 확인하세요"> <span>기본</span></a></li>
                <li><a href="#tabs-2" title="탭클릭 시, 저장여부 확인하세요"><span>A계열</span></a></li>
                <li><a href="#tabs-3" title="탭클릭 시, 저장여부 확인하세요"><span>B계열</span></a></li>
            </ul>
            <table class="table_typeB">
			<caption>탭구성</caption>
			<colgroup>
                <col width="80px" />
                <col />
			</colgroup>
			<tbody>
                <tr>
                    <th>탭이름&nbsp;<a id="MultiName"><img src="/DeskPlusEIP/Design/Base/Img/Icon/ico_add.gif"/></a></th>
                    <td>
                        <input type="text" style="width:40% !important;" />
                        <input type="text" style="width:40% !important;" />
                    </td>
                </tr>
                <tr>
                    <th>수정여부</th>
                    <td>
                        <select class="searchselect">
                            <option value="">수정불가</option>
                            <option value="">수정가능</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th><label title="레이아웃">레이아웃</label></th>
                    <td>
                        
                        <ul class="aLeft">
                            <li><img src="/DeskPlusEIP/Design/Base/Img/Layout/layout_one_on.gif" alt="1단" title="1단" /><br /><input type="radio" name="rbLayout" checked="checked" /><label title="1단">1단(단일형)</label></li>
                            <li><img src="/DeskPlusEIP/Design/Base/Img/Layout/layout_twoA.gif" alt="2단(분배형)" title="2단(분배형)" /><br /><input type="radio" name="rbLayout" /><label title="2단(분배형)">2단(분배형)</label></li>
                            <li><img src="/DeskPlusEIP/Design/Base/Img/Layout/layout_twoB.gif" alt="2단(왼 쪽)" title="2단(왼 쪽)" /><br /><input type="radio" name="rbLayout" /><label title="2단(왼 쪽)">2단(왼 쪽)</label></li>
                            <li><img src="/DeskPlusEIP/Design/Base/Img/Layout/layout_twoC.gif" alt="2단(오른쪽)" title="2단(오른쪽)" /><br /><input type="radio" name="rbLayout" /><label title="2단(오른쪽)">2단(오른쪽)</label></li>
                            <li><img src="/DeskPlusEIP/Design/Base/Img/Layout/layout_threeA.gif" alt="3단(가운데)" title="3단(가운데)" /><br /><input type="radio" name="rbLayout" /><label title="3단(가운데)">3단(가운데)</label></li>
                            <li><img src="/DeskPlusEIP/Design/Base/Img/Layout/layout_threeB.gif" alt="3단(분배형)" title="3단(분배형)" /><br /><input type="radio" name="rbLayout" /><label title="3단(분배형)">3단(분배형)</label></li>
                            <li><img src="/DeskPlusEIP/Design/Base/Img/Layout/layout_four.gif" alt="4단(분배형)" title="4단(분배형)" /><br /><input type="radio" name="rbLayout" /><label title="4단(분배형)">4단(분배형)</label></li>
                        </ul>

                    </td>
                </tr>
                <tr>
                    <th rowspan="2"><label title="권한/역할지정">권한/역할지정</label></th>
                    <td>
                        보안등급
                        <select class="searchselect">
    	                    <option value="" selected="selected">선택없음</option>
	                        <option value="">1등급이상</option>
                            <option value="">...</option>
                            <option value="">10등급이상</option>
                        </select>
                        은 메뉴사용가능.
                    </td>
                </tr>
                <tr>
                    <td>

                        <div class="eip_auth_left">
                            <div class="rTableTop"><p></p></div>
	                        <div class="rTableMid">
                                - Role <br />
                                - 조직도
                            </div>
                            <div class="rTableBot"><p></p></div>
                        </div>
                        <div class="eip_auth_middle">
                            <ul>
                                <li><a href="#"><img src="/DeskPlusEIP/Design/Base/Img/Btn/tree_btnAdd.gif" alt="추가" /></a></li>
                                <li><a href="#"><img src="/DeskPlusEIP/Design/Base/Img/Btn/tree_btnDel.gif" alt="삭제" /></a></li>
                            </ul>
                        </div>
                        <div class="eip_auth_right">

                            <table class="table_typeC">
                            <caption>권한리스트</caption>
                            <colgroup>
                                <col />
                                <col />
                                <col />
                            </colgroup>
                            <thead>
                                <tr>
                                    <th class="th"><input type="checkbox" /></th>
                                    <th class="th">명칭</th>
                                    <th class="th">삭제여부</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="td"><input type="checkbox" /></td>
                                    <td class="td">솔루션개발 사원 홍길동 deskplus</td>
                                    <td class="td"><a href="#" title="삭제"><img src="/DeskPlusEIP/Design/Base/Img/Icon/ico_delete.gif" alt="삭제" /></a></td>
                                </tr>
                            </tbody>
                            </table>

                        </div>

                    </td>
                </tr>
                <tr>
                    <th>활성여부</th>
                    <td>
                        <select class="searchselect">
                            <option value="">활성화</option>
                            <option value="">비활성화</option>
                        </select>
                    </td>
                </tr>
                
            </tbody>
            </table>

        </div>
    </div>

    <div class="bottom-left"></div>
    <div class="bottom-right"></div>
</div>
