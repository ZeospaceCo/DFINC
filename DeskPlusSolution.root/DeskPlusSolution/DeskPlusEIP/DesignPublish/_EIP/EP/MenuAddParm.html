<div class="layer_popup">

        </div>
        <div class="dotLine"></div>

            <table class="table_typeB">

			<colgroup>

                        <ul class="aLeft">

                                <select class="searchselect">

	                                <option value="">기타입력</option>

                    </td>
                </tr>
                <tr>

                    <td><input type="text" style="width:95% !important;" /></td>
                </tr>
                <tr>

                                    <option value="">...</option>

                        </ul>
                    </td>
                </tr>
                <tr>
                    <th>기타</th>
                    <td><input type="text" style="width:95% !important;" /></td>
                </tr>
            </tbody>
            </table>

        </div>

    <div class="bottom-left"></div>
    <div class="bottom-right"></div>
