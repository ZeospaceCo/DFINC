<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link rel="stylesheet" type="text/css" href="/DeskPlusEIP/Design/Base/Css/DeskPlusEIPBase.css?v=1" />
<link rel="stylesheet" type="text/css" href="/DeskPlusEIP/Design/Base/Css/Func_EIP.css?v=1" />
<title>DeskPlus4.0 웹표준</title>
</head>
<body>


<div class="layer_popup">
    <div class="top-left"></div>
    <div class="top-right"></div>

    <div class="inside">
        <div class="popup_header">
            <h5>코드관리</h5>
            <ul class="btn_right">
                <li class="btn_blue"><a href="" title=""><span>추가</span></a></li>
                <li><a href="CodeList.html" title=""><span>취소</span></a></li>
            </ul>
        </div>
        <div class="dotLine"></div>
        <div class="popup_layout_style3">
            


            <table class="table_typeB">
			<caption>시스템코드관리</caption>
			<colgroup>
                <col width="80px" />
                <col />
            </colgroup>
            <tbody>
                <tr>
                    <th>시스템코드명</th>
                    <td>학력코드(수정불가)</td>
                </tr>
                <tr>
                    <th>시스템코드설명</th>
                    <td>학력코드부분입니다.(상위카테고리정보입니다)</td>
                </tr>
            </tbody>
            </table>
            <div class="layout_subbox">
                <h2>코드정보</h2>
            </div>
            <table class="table_typeB">
			<caption>코드관리</caption>
			<colgroup>
                <col width="80px" />
                <col />
                <col width="80px" />
                <col />
            </colgroup>
            <tbody>
                <tr>
                    <th>코드</th>
                    <td>
                        <span class="aLeft"><input type="text" style="width:150px !important;" /></span>
                        <ul class="btn_smallL">
                            <li><a href="#"><span>중복체크</span></a></li>
                        </ul>
                    </td>
                    <th>코드명</th>
                    <td><input type="text" style="width:150px !important;" /></td>
                </tr>
                <tr>
                    <th>코드설명</th>
                    <td colspan="3"><input type="text" style="width:98% !important;" /></td>
                </tr>
                <tr>
                    <th>외부연동코드</th>
                    <td><input type="text" style="width:98% !important;" /></td>
                    <th>활성화여부</th>
                    <td>
                        <select class="searchselect">
	                        <option value="">활성</option>
	                        <option value="">비활성</option>
                        </select>
                    </td>
                </tr>
            </tbody>
            </table>


        </div>
    </div>

    <div class="bottom-left"></div>
    <div class="bottom-right"></div>
</div>


</body>
</html>
