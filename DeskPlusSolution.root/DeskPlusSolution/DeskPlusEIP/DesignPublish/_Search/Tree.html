<body>
<div id="srh_layout_left">

    <div class="srh_blue_m">
        <ul class="srh_inbox">
            <li class="srh_darkgray_int"></li>
            <li class="srh_darkgray_inm">
                <img src="/DeskPlusEIP/Design/Base/Img/Search/srh_bar.gif" alt="" />
            </li>
            <li class="srh_darkgray_inb"></li>
        </ul>

        <ul class="srh_inbox">
            <li class="srh_gray_int"></li>
            <li class="srh_gray_inm">
                <ul class="srh_ul">
                    <li class="bar"><img src="/DeskPlusEIP/Design/Base/Img/Search/srh_barQna1.gif" alt="" /></li>
                    <li>검색어1 <span class="srh_emp">&</span> 검색어2</li>
                    <li>검색어1,2 를 모두 포함</li>
                </ul>
            </li>
            <li class="srh_gray_inb"></li>
        </ul>

        <ul class="srh_inbox">
            <li class="srh_gray_int"></li>
            <li class="srh_gray_inm">
                <ul class="srh_ul">
                    <li class="bar"><img src="/DeskPlusEIP/Design/Base/Img/Search/srh_barQna2.gif" alt="" /></li>
                    <li>검색어1 <span class="srh_emp">|</span> 검색어2</li>
                    <li>검색어1,2 중 하나라도 포함</li>
                </ul>
            </li>
            <li class="srh_gray_inb"></li>
        </ul>

        <ul class="srh_inbox">
            <li class="srh_gray_int"></li>
            <li class="srh_gray_inm">
                <ul class="srh_ul">
                    <li class="bar"><img src="/DeskPlusEIP/Design/Base/Img/Search/srh_barQna3.gif" alt="" /></li>
                    <li>검색어1 <span class="srh_emp">!</span> 검색어2</li>
                    <li>검색어1은 포함, 2는 제외</li>
                </ul>
            </li>
            <li class="srh_gray_inb"></li>
        </ul>

        <ul class="srh_inbox">
            <li class="srh_gray_int"></li>
            <li class="srh_gray_inm">
                <ul class="srh_ul">
                    <li class="bar"><img src="/DeskPlusEIP/Design/Base/Img/Search/srh_barQna4.gif" alt="" /></li>
                    <li>검색어1 <span class="srh_emp">(</span>검색조건2<span class="srh_emp">)</span></li>
                    <li>검색조건2 를 먼저 수행</li>
                </ul>

            <li class="srh_gray_inb"></li>
        </ul>
