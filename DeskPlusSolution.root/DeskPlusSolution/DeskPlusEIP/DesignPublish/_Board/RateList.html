<title>DeskPlus4.0 웹표준</title>

<body>


<div class="layer_popup">
    <div class="top-left"></div>
    <div class="top-right"></div>

    <div class="inside">
        <div class="popup_header">
            <h5>평가</h5>
            <ul class="btn_right">
                <li class="btn_blue"><a href="" title=""><span>확인</span></a></li>
                <li><a href="" title=""><span>닫기</span></a></li>
            </ul>
        </div>
        <div class="dotLine"></div>
        <div class="popup_layout_style3">
            
            <div class="boa_rate_layleft">
                <span>내용에 대한 평가를 투표해 주시기 바랍니다.</span>
                <ul>
                    <li class="top"><span>우수</span></li>
                    <li><input type="radio" /> 5 : <img src="/DeskPlusEIP/Design/Base/Img/Icon/ico_rate5.gif" alt="" title="" /></li>
                    <li><input type="radio" /> 4 : <img src="/DeskPlusEIP/Design/Base/Img/Icon/ico_rate4.gif" alt="" title="" /></li>
                    <li><input type="radio" /> 3 : <img src="/DeskPlusEIP/Design/Base/Img/Icon/ico_rate3.gif" alt="" title="" /></li>
                    <li><input type="radio" /> 2 : <img src="/DeskPlusEIP/Design/Base/Img/Icon/ico_rate2.gif" alt="" title="" /></li>
                    <li><input type="radio" /> 1 : <img src="/DeskPlusEIP/Design/Base/Img/Icon/ico_rate1.gif" alt="" title="" /></li>
                    <li class="bott"><span>부족</span></li>
                </ul>
            </div>
            <div class="boa_rate_layright">
                평가비율 : <span class="boa_orangeSqu">0.0</span> out of 5.0

                <div class="stat">
                            <table align="center">
                            <colgroup>
                                <col width="30px" />
                                <col width="30px" />
                                <col width="30px" />
                                <col width="30px" />
                                <col width="30px" />
                            </colgroup>
                            <tbody>
                                <tr class="tr1">
                                    <td><div style="height:10px;"></div></td>
                                    <td><div style="height:20px;"></div></td>
                                    <td><div style="height:10px;"></div></td>
                                    <td><div style="height:10px;"></div></td>
                                    <td><div style="height:10px;"></div></td>
                                </tr>
                                <tr class="tr2">
                                    <td>1</td>
                                    <td>2</td>
                                    <td>3</td>
                                    <td>4</td>
                                    <td>5</td>
                                </tr>
                            </tbody>
                            </table>
                        
                        </div>


                <span class="boa_orangeSqu">0</span> 분이 평가 해주셨습니다
            </div>

        </div>
    </div>

    <div class="bottom-left"></div>
    <div class="bottom-right"></div>
</div>
