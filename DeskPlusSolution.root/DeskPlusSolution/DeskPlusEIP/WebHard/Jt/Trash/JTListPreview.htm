<div class="album_cont">
<ul>
    {#foreach $T as List}
	<li>   
        <div class="thumb">
        <dl class="sub">
            <dd>
                <input type="checkbox" class="cbxID" id="cbxID{ $T.List.ROW }" value="{ $T.List.FileID }" />
            </dd>
        </dl>
        <dl class="album_img">  
            <img id="{ $T.List.FileID }" action="attach" style="cursor:pointer" src="{$T.List.ScreenShotImage }" FilePath='{ $T.List.FilePath }' FileGUID='{ $T.List.FileGUID }' />            
        </dl>
        <dl class="text"> 
            <dd>{$T.List.WriteDate }&nbsp;&nbsp;{$T.List.FileLength }</dd>
		</dl>
        <dl class="text"> 
            <dd>{$T.List.WriteName }</dd>
            <dd>{$T.List.FolderName }</dd>
            <dt>     
                <a href="#" onclick="ListPreview.TitleDownLoad('{ $T.List.FileID }','{ $T.List.FilePath }');return false;" style="cursor:pointer">
                <span class="fontCut" id="fileName_{ $T.List.FileID }">{ $T.List.FileName }</span>
                </a>
            </dt>
		</dl>
	</div>         
	</li>
    {#else}
    <li>
        <span id="NoListData" />
    </li>
    {#/for}   
</ul>
</div>
