<table class="table_typeA"> 
<caption>웹하드 리스트</caption>
<colgroup>
    <col width="40px" />
    <col width="0px" style="display:none" />
    <col width="*" />
    <col width="80px" />
</colgroup>
<tr>
    <th class="center" id="r_checked"><input id="cbxAll" type="checkbox" onclick="WebHardAttach.Checked()" /></th>
    <th class="center" style="display:none"></th>
    <th class="center"><a id="a_FileName" href="#" onclick="javascript:WebHardAttach.Sort ('FileName')" ><span id="r_fileName"></span></a></th>                        
    <th class="center"><a id="a_FileLength" href="#" onclick="javascript:WebHardAttach.Sort ('FileLength')"><span id="r_fileLength"></span></a></th>
</tr>
{#foreach $T as List}
<tr>
    <td class="center"><input type="checkbox" class="cbxID" id="cbxID{ $T.List.ROW }" value="{ $T.List.FileID }" /></td>
    <td class="center" style="display:none" id="{ $T.List.FileID }">{ $T.List.FileGUID }</td>
    <td id="fileName_{ $T.List.FileID }">{$T.List.FileName }</td>
    <td class="center">{$T.List.FileLength } KB</td>
</tr>
{#else}
 <tr>
    <td colspan="3" class="center"><span id="NoListData" /></td>       
 </tr>
{#/for}    
</table>
