<table cellspacing="0" class="table_typeA"> 
<caption>
    웹하드 리스트
</caption>
<colgroup>
    <col width="40px" />
    <col width="150px" />
    <col width="200px" />
    <col width="60px" />
    <col width="90px" />
    <col width="90px" />
    <col width="100px" />
    <col width="100px" />
    <col width="100px" />
</colgroup>
<tr>
    <th class="center" id="r_checked"><input id="cbxAll" type="checkbox" onclick="ListImpo.Checked()" /></th>
    <th class="center" id="r_folderName"></th>
    <th class="center"><a id="a_FileName" href="#" onclick="javascript:ListImpo.Sort ('FileName')"><span id="r_fileName"></span></a></th>
    <th class="center" id="r_download" class="center"></th>                            
    <th class="center"><a id="a_FileLength" href="#" onclick="javascript:ListImpo.Sort ('FileLength')"><span id="r_fileLength"></span></a></th>
    <th class="center"><a id="a_FileType" href="#" onclick="javascript:ListImpo.Sort ('FileType')"><span id="r_fileType"></span></a></th>
    <th class="center" id="r_regUser"></th>
    <th class="center"><a id="a_WriteDate" href="#" onclick="javascript:ListImpo.Sort ('WriteDate')"><span id="r_writeDate"></span></a></th>
    <th class="center" id="r_sendUser"></th> 
</tr>
{#foreach $T as List}
<tr>
    <td class="center"><input type="checkbox" class="cbxID" id="cbxID{ $T.List.ROW }" value="{ $T.List.FileID }" /></td>
    <td class="center">{$T.List.FolderName }</td>
    <td><span action="attach" style="cursor:pointer" FolderID ='{ $T.List.FolderID }' FilePath='{ $T.List.DownPath }'>{$T.List.FileName }</span></td>
    <td class="center"><i class="fas fa-arrow-alt-circle-down" id="{ $T.List.FileID }" action="attach" style="cursor:pointer" FolderID ='{ $T.List.FolderID }' FilePath='{ $T.List.DownPath }'></i></td>  
    <td class="center">{$T.List.FileLength }</td>
    <td class="center">{$T.List.FileType }</td>
    <td class="center">{$T.List.WriteName }</td>
    <td class="center">{$T.List.WriteDate }</td>
    <td class="center"><a onclick="AccountInfo('{ $T.List.SendUserID }');return false;"><span class="name">{ $T.List.SendName }</span></a></td>
</tr>
{#else}
 <tr>
    <td colspan="9" class="center"><span id="NoListData" /></td>       
 </tr>
{#/for}    
</table>
