<table class="tbl_type"> 
<tr>    
    <th width="200px" id="r_ssendUser"></th>
    <th style="min-width:350px" id="r_sfileName"></th>    
    <th width="60px" id="r_sdownload"></th>                            
    <th width="90px" id="r_sfileLength"></th>
    <th width="90px" id="r_sfileType"></th>   
    <th width="100px" id="r_sregUser"></th> 
    <th width="100px" id="r_swriteDate"></th>
</tr>
{#foreach $T as List}
<tr>    
    <td class="center">{$T.List.SendName }</td>
    <td><span action="attach" style="cursor:pointer" FilePath='{ $T.List.DownPath }'>{$T.List.FileName }</span></td>
    <td class="center">
        <i class="fas fa-arrow-alt-circle-down" id="{ $T.List.FileID }" action="attach" style="cursor:pointer" FilePath='{ $T.List.DownPath }'></i>
    </td>
    <td class="center">{$T.List.FileLength }</td>
    <td class="center">{$T.List.FileType }</td>
    <td class="center">{$T.List.WriteName }</td>
    <td class="center">{$T.List.WriteDate }</td>
</tr>
{#else}
 <tr>
    <td colspan="7" class="center"><span id="sNoListData" /></td>       
 </tr>
{#/for}    
</table>
