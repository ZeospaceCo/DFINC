
    {#foreach $T as List}
        <li style="height:20px; background: url(/DeskPlusEIP/Design/C/img/Package/lidot.gif) 0px 7px no-repeat;padding-left:5px;overflow:hidden;position:relative;">
        <span style="border:0px solid red;">
            <a onclick="PopupWinOpen('{ $T.List.HrefUrl }','','',1200,800,'menubar=no,location=no,resizable=yes,scrollbars=yes,status=no');" style="cursor:pointer">
            { $T.List.Title }
            </a>
        </span>
        <span style="position:absolute; right:0px; top:0px; width:130px;border:0px solid red; float:right; background:#fff; float:right; padding-left:10px;">
            <a onclick="AccountInfo('{ $T.List.WriteUserID }');return false;"><span class="name">{ $T.List.WriteUserName }</span></a>
            <em style="margin-left:10px; width:80px; overflow: visible;border:0px solid red; float:right;">{ $T.List.WriteDate }</em>
        </span>
        </li>    
    {#else}     
        <li><span class="NoListData"></span></li>            
    {#/for}
