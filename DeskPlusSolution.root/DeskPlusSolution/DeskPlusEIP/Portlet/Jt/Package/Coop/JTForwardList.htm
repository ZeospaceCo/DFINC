
    {#foreach $T as List}
        <li>
        <span class="mcopy">
        {#if $T.List.Gubun == 'COOP'}
        <a onclick="TabCoopMain_PopupCoopFWD('{ $T.List.ForwardListID }','{ $T.List.ForwardGroupID }');return false;" style="cursor:pointer" >
        {#elseif $T.List.Gubun == 'RM'}
        {#elseif $T.List.Gubun == 'REPORT'}
        
        {#/if}
        [{ $T.List.HeaderTitle }] { $T.List.Title }</a>
        
        {#if $T.List.ShowNew == 'Y'} <img class="BtnNew" alt="" />{#/if} 
        </span>                

        <span class="etcinfo"  style="min-width:200px;border:0px solid #f00;">
            <img class="statebar" 
            {#if $T.List.StatusLast == '1'} src="/DeskPlusEIP/Design/C/Img/Icon/r.gif" 
            {#elseif $T.List.StatusLast == '2'} src="/DeskPlusEIP/Design/C/Img/Icon/a.gif"             
            {#elseif $T.List.StatusLast == '3'} src="/DeskPlusEIP/Design/C/Img/Icon/i.gif" 
            {#elseif $T.List.StatusLast == '4'} src="/DeskPlusEIP/Design/C/Img/Icon/e.gif" 
            {#/if} 
            alt="{ $T.List.StatusLastName }" title="{ $T.List.StatusLastName }" />&nbsp;
            <a onclick="AccountInfo('{ $T.List.WriteUserID }');return false;"><span class="name">{ $T.List.NameBase }</span></a>
            <em style="min-width:80px;">{ $T.List.WriteDate }</em>
        </span>
        </li>    
    {#else}     
        <li><span class="NoListData"></span></li>            
    {#/for}
