
<ul>
    {#foreach $T as List}
        <li>
        <span class="list-titlebig">
        <a href="{ $T.List.Link }" target="_blank">{ $T.List.Title }</a>
        </span>
        <span class="list-date">{ $T.List.Pubdate.split(',')[0] }</span>
        </li>    
    {#else}     
        <li><span class="NoListData"></span></li>            
    {#/for}  
</ul>
